spring.application.name=nextware-backend

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nextware
spring.datasource.username=nextware
spring.datasource.password=nextware_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.locations=filesystem:../database/migrations

# SQL logging
spring.jpa.show-sql=false

# JWT
nextware.jwt.secret=${NEXTWARE_JWT_SECRET}
nextware.jwt.expiration-minutes=${NEXTWARE_JWT_EXPIRATION_MINUTES:480}

# Development data bootstrap (dev profile only; see DevelopmentDataSeeder)
nextware.security.bootstrap.enabled=${NEXTWARE_SECURITY_BOOTSTRAP_ENABLED:false}
nextware.security.bootstrap.username=${NEXTWARE_SECURITY_BOOTSTRAP_USERNAME:admin}
nextware.security.bootstrap.email=${NEXTWARE_SECURITY_BOOTSTRAP_EMAIL:admin@nextware.local}
nextware.security.bootstrap.password=${NEXTWARE_SECURITY_BOOTSTRAP_PASSWORD:}

# Seed realistic demo master data for the demo and test companies (dev only).
nextware.demo-data.enabled=${NEXTWARE_DEMO_DATA_ENABLED:false}