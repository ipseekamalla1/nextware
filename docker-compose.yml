services:
  postgres:
    image: postgres:16
    container_name: nextware-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nextware
      POSTGRES_USER: nextware
      POSTGRES_PASSWORD: nextware_dev_password

    ports:
      - "5432:5432"

    volumes:
      - nextware_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextware -d nextware"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextware_postgres_data: